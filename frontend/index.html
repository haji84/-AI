<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消防業務 Local AI</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{height:58px;background:#fff;border-bottom:1px solid #d9dee5;display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:20}
header strong{font-size:1.05rem}.muted{color:#66717d;font-size:.88rem}.grow{flex:1}.pill{display:inline-flex;align-items:center;border:1px solid #cbd3dc;border-radius:999px;padding:3px 9px;font-size:.8rem;background:#fff}.pill.active{border-color:#8aa6c4}.dangerText{color:#9d2c2c}
.shell{display:grid;grid-template-columns:380px 1fr;min-height:calc(100vh - 58px)}.sidebar{border-right:1px solid #d9dee5;background:#fff;padding:14px;overflow:auto}.main{padding:18px;overflow:auto}
.card{background:#fff;border:1px solid #d9dee5;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,30,40,.03)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{border:1px solid #bcc6d1;border-radius:8px;padding:9px 10px;background:#fff;min-width:0}textarea{resize:vertical;min-height:80px}.btn{border:1px solid #aeb8c3;background:#fff;border-radius:8px;padding:9px 12px}.btn.primary{background:#183b5b;color:#fff;border-color:#183b5b}.btn.danger{color:#8c2323;border-color:#c89b9b}.btn:disabled{opacity:.45;cursor:not-allowed}
.searchRow{display:grid;grid-template-columns:1fr auto;gap:8px}.facilityItem{padding:11px;border:1px solid transparent;border-bottom-color:#edf0f3;cursor:pointer;border-radius:8px}.facilityItem:hover,.facilityItem.selected{background:#f1f5f8;border-color:#dbe3ea}.facilityItem b{display:block}.facilityItem .meta{font-size:.82rem;color:#6b7580;margin-top:4px}
.pagebar{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.empty{padding:28px;text-align:center;color:#78828d;border:1px dashed #cad1d8;border-radius:10px;background:#fafbfc}
.hero{display:flex;gap:10px;align-items:flex-start}.hero h1{font-size:1.35rem;margin:0 0 5px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tab{border:1px solid #cbd3dc;background:#fff;border-radius:999px;padding:7px 11px}.tab.on{background:#e9f0f6;border-color:#9eb5ca}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:grid;gap:4px}.field label{font-size:.8rem;color:#62707e}.value{padding:8px 0;min-height:34px;white-space:pre-wrap}.sectionTitle{font-weight:700;margin:0 0 12px}
table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e4e8ec;text-align:left;padding:8px;font-size:.9rem;vertical-align:top}th{color:#5f6b77;font-weight:600;background:#fafbfc}.scroll{overflow:auto}
.future{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.future button{text-align:left;padding:12px;border:1px solid #d7dde3;background:#fafbfc;border-radius:10px}.future span{display:block;font-size:.78rem;color:#78828d;margin-top:4px}
.modalWrap{position:fixed;inset:0;background:rgba(22,30,38,.45);z-index:40;display:grid;place-items:center;padding:16px}.modal{background:#fff;width:min(1000px,96vw);max-height:92vh;overflow:auto;border-radius:14px;border:1px solid #ccd3da;box-shadow:0 18px 60px rgba(0,0,0,.2)}.modalHead{position:sticky;top:0;background:#fff;border-bottom:1px solid #e0e4e8;padding:14px 18px;display:flex;align-items:center;z-index:2}.modalBody{padding:18px}.modalFoot{position:sticky;bottom:0;background:#fff;border-top:1px solid #e0e4e8;padding:12px 18px;display:flex;justify-content:flex-end;gap:8px}
.notice{border:1px solid #e0c47b;background:#fff9e8;padding:10px 12px;border-radius:9px;margin-bottom:10px}.conflict{border:1px solid #d49999;background:#fff4f4;padding:12px;border-radius:9px}.diffRow{display:grid;grid-template-columns:180px 1fr 1fr;gap:8px;border-bottom:1px solid #eadcdc;padding:6px 0;font-size:.85rem}.legacy{font-size:.83rem}.history{border-left:3px solid #ccd5df;padding:8px 0 8px 12px;margin:8px 0}.loginBox{max-width:520px;margin:10vh auto}.loginBox h1{margin-top:0}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #d9dee5;max-height:45vh}.grid2,.grid3{grid-template-columns:1fr}.future{grid-template-columns:1fr}.diffRow{grid-template-columns:1fr}.main{padding:12px}}
</style>
</head>
<body>
<header><strong>消防業務 Local AI</strong><span class="pill active">Phase 9</span><span class="muted">対象物・査察・届出・法令・図面・火災調査・写真・音声供述AI</span><span class="grow"></span><button id="fireInvestigationBtn" class="btn hidden" onclick="openFireInvestigations()">火災調査</button><button id="legalReviewBtn" class="btn hidden" onclick="openLegalReview()">法令レビュー</button><button id="logoutBtn" class="btn hidden" onclick="logout()">ログアウト</button></header>

<section id="loginView" class="loginBox card">
<h1>ログイン</h1>
<p class="muted">庁内アカウントでログインしてください。</p>
<div class="stack"><input id="loginUser" placeholder="ユーザー名" autocomplete="username"><input id="loginPass" type="password" placeholder="パスワード" autocomplete="current-password"><button class="btn primary" onclick="login()">ログイン</button><div id="loginMsg" class="muted"></div></div>
</section>

<section id="appView" class="shell hidden">
<aside class="sidebar">
<div class="toolbar"><b>防火対象物</b><span class="grow"></span><button class="btn primary" onclick="openCreate()">＋ 新規</button></div>
<div class="searchRow"><input id="searchQ" placeholder="名称・住所・整理番号で検索"><button class="btn" onclick="loadFacilities(0)">検索</button></div>
<div class="row" style="margin-top:8px"><select id="statusFilter" onchange="loadFacilities(0)"><option value="">すべて</option><option value="active">使用中</option><option value="abolished">廃止</option></select><select id="sortBy" onchange="loadFacilities(0)"><option value="name">名称順</option><option value="address">所在地順</option><option value="legacy_serial_no">整理番号順</option><option value="updated_at">更新順</option></select><select id="sortDir" onchange="loadFacilities(0)"><option value="asc">昇順</option><option value="desc">降順</option></select></div>
<div id="listSummary" class="muted" style="margin:10px 2px"></div><div id="facilityList"></div>
<div class="pagebar"><button id="prevBtn" class="btn" onclick="changePage(-1)">前へ</button><span id="pageInfo" class="muted"></span><button id="nextBtn" class="btn" onclick="changePage(1)">次へ</button></div>
</aside>
<main class="main">
<div id="noSelection" class="empty">左の一覧から対象物を選択してください。</div>
<div id="detailView" class="hidden"></div>
</main>
</section>

<div id="editModal" class="modalWrap hidden">
<div class="modal">
<div class="modalHead"><b id="modalTitle">対象物編集</b><span class="grow"></span><button class="btn" onclick="closeEdit()">閉じる</button></div>
<div class="modalBody"><div id="editNotice"></div><div id="editFields"></div></div>
<div class="modalFoot"><button class="btn" onclick="closeEdit()">キャンセル</button><button class="btn primary" onclick="saveFacility()">保存</button></div>
</div>
</div>

<div id="legalReviewModal" class="modalWrap hidden">
<div class="modal">
<div class="modalHead"><b>法令レビュー</b><span class="grow"></span><button class="btn" onclick="closeLegalReview()">閉じる</button></div>
<div class="modalBody">
<div class="notice">自動抽出は関連候補の優先順位付けだけです。Rule条件・結論は職員確認後に作成し、正式承認は別Gateです。</div>
<div id="legalCoverageStats" class="grid2" style="margin-bottom:10px"></div>
<div class="row" style="margin-bottom:10px"><button class="btn" onclick="showLegalQueue()">条文候補</button><button class="btn" onclick="showLegalDrafts()">Rule草案</button></div>
<div id="legalQueueControls" class="row" style="margin-bottom:10px">
<select id="legalReviewStatus" onchange="loadLegalReview(0)">
<option value="pending">未確認</option>
<option value="reviewed">レビュー済み</option>
<option value="drafted">Rule草案化済み</option>
<option value="ignored">対象外</option>
<option value="">すべて</option>
</select>
<select id="legalReviewCategory" onchange="loadLegalReview(0)">
<option value="">全カテゴリ</option>
<option value="equipment_requirement">必要設備</option>
<option value="submission_requirement">必要届出</option>
<option value="fire_management">防火・防災管理</option>
<option value="inspection_enforcement">査察・違反是正</option>
<option value="hazardous_materials">危険物</option>
<option value="fire_prevention_local">火災予防条例系</option>
</select>
<select id="legalReviewLane" onchange="loadLegalReview(0)">
<option value="">全優先レーン</option>
<option value="national_core">国法コア</option>
<option value="local_core">ローカルコア</option>
<option value="normal">通常</option>
</select>
<select id="legalReviewContext" onchange="loadLegalReview(0)">
<option value="">全文脈</option>
<option value="main">本文</option>
<option value="supplementary_transition">附則・経過措置</option>
<option value="document_body">告示等本文</option>
</select>
<input id="legalReviewQ" placeholder="法令名・条文を検索" style="min-width:190px" onkeydown="if(event.key==='Enter')loadLegalReview(0)">
<input id="legalReviewMinScore" type="number" min="0" step="0.5" value="2" style="max-width:100px" onchange="loadLegalReview(0)" title="最低関連度">
<input id="legalReviewMinPriority" type="number" step="0.5" value="0" style="max-width:100px" onchange="loadLegalReview(0)" title="最低総合優先度">
<button class="btn" onclick="loadLegalReview(0)">更新</button>
</div>
<div id="legalReviewStats" class="row muted" style="margin-bottom:8px"></div>
<div id="legalDraftControls" class="row hidden" style="margin-bottom:10px">
<select id="legalDraftStatus" onchange="loadLegalDrafts()">
<option value="pending">未確認草案</option>
<option value="reviewed">レビュー済み</option>
<option value="promoted">Draft Rule化済み</option>
<option value="rejected">却下</option>
<option value="">すべて</option>
</select>
<button class="btn" onclick="loadLegalDrafts()">更新</button>
</div>
<div id="legalReviewSummary" class="muted" style="margin-bottom:10px"></div>
<div id="legalReviewList"></div>
<div id="legalReviewPager" class="pagebar">
<button id="legalReviewPrev" class="btn" onclick="changeLegalReviewPage(-1)">前へ</button>
<span id="legalReviewPageInfo" class="muted"></span>
<button id="legalReviewNext" class="btn" onclick="changeLegalReviewPage(1)">次へ</button>
</div>
</div>
</div>
</div>

<div id="legalDraftEditModal" class="modalWrap hidden" style="z-index:60">
<div class="modal" style="width:min(900px,96vw)">
<div class="modalHead"><b>Rule草案編集</b><span class="grow"></span><button class="btn" onclick="closeLegalDraftEdit()">閉じる</button></div>
<div class="modalBody">
<div class="grid2">
<div class="field"><label>Rule Code</label><input id="legalDraftCode"></div>
<div class="field"><label>草案名</label><input id="legalDraftName"></div>
</div>
<div class="field" style="margin-top:10px"><label>条件 JSON</label><textarea id="legalDraftConditions" style="min-height:170px"></textarea></div>
<div class="field" style="margin-top:10px"><label>結論 JSON</label><textarea id="legalDraftOutcome" style="min-height:150px"></textarea></div>
<div class="field" style="margin-top:10px"><label>確認メモ</label><textarea id="legalDraftRationale" style="min-height:100px"></textarea></div>
<div id="legalDraftEditMsg" class="muted" style="margin-top:8px"></div>
</div>
<div class="modalFoot"><button class="btn" onclick="closeLegalDraftEdit()">キャンセル</button><button class="btn primary" onclick="saveLegalDraftEdit()">保存</button></div>
</div>
</div>


<input id="drawingFileInput" class="hidden" type="file" accept=".pdf,.png,.jpg,.jpeg" onchange="uploadDrawingFile(event)">

<div id="drawingReviewModal" class="modalWrap hidden" style="z-index:65">
<div class="modal" style="width:min(1000px,96vw)">
<div class="modalHead"><b>図面解析レビュー</b><span class="grow"></span><button class="btn" onclick="closeDrawingAnalysis()">閉じる</button></div>
<div class="modalBody"><div id="drawingReviewBody"></div></div>
</div>
</div>


<input id="fireMediaFileInput" class="hidden" type="file" onchange="uploadFireMediaFile(event)">

<div id="fireInvestigationModal" class="modalWrap hidden" style="z-index:70">
<div class="modal" style="width:min(1220px,98vw)">
<div class="modalHead"><b>火災調査</b><span class="grow"></span><button class="btn" onclick="closeFireInvestigations()">閉じる</button></div>
<div class="modalBody">
<div class="notice">写真・音声・AI供述・原因候補・報告Draftは派生情報です。正式な火災原因と正式報告はHuman Gateを通して確定します。</div>
<div class="row" style="margin-bottom:10px">
<input id="fireCaseQ" placeholder="事案番号・件名・場所を検索" style="min-width:230px" onkeydown="if(event.key==='Enter')loadFireCases()">
<select id="fireCaseStatus" onchange="loadFireCases()"><option value="">全状態</option><option value="draft">draft</option><option value="active">active</option><option value="review">review</option><option value="closed">closed</option></select>
<button class="btn" onclick="loadFireCases()">検索</button>
<button class="btn primary" onclick="createFireCase()">＋ 調査Case</button>
</div>
<div style="display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.8fr);gap:12px">
<div><div id="fireCaseList"></div></div>
<div><div id="fireCaseDetail" class="empty">左の一覧から火災調査Caseを選択してください。</div></div>
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const state={offset:0,limit:50,total:0,selected:null,detail:null,mode:null,draft:null,drawings:[],drawingAnalysisId:null,drawingDetail:null};
const legalReviewState={offset:0,limit:50,total:0};
const fireState={caseId:null,detail:null,mediaType:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const val=v=>(v===null||v===undefined||v==='')?'－':esc(v);

async function api(url,opt={}){const r=await fetch(url,opt);let body=null;try{body=await r.json()}catch{}if(!r.ok){const e=new Error(body?.detail?.message||body?.detail||`HTTP ${r.status}`);e.status=r.status;e.body=body;throw e}return body}
async function login(){try{await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value,password:$('loginPass').value})});$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('legalReviewBtn').classList.remove('hidden');$('fireInvestigationBtn').classList.remove('hidden');await loadFacilities(0)}catch(e){$('loginMsg').textContent='ログインできません。ユーザー名・パスワードを確認してください。'}}
async function logout(){try{await fetch('/auth/logout',{method:'POST'})}catch{}location.reload()}

async function loadFacilities(offset=state.offset){state.offset=Math.max(0,offset);const p=new URLSearchParams({offset:state.offset,limit:state.limit,sort_by:$('sortBy').value,sort_dir:$('sortDir').value});if($('searchQ').value.trim())p.set('q',$('searchQ').value.trim());if($('statusFilter').value)p.set('status_filter',$('statusFilter').value);try{const d=await api('/facilities?'+p);state.total=d.total;renderList(d.items)}catch(e){if(e.status===401){location.reload();return}$('facilityList').innerHTML='<div class="empty">一覧を取得できません</div>'}}
function renderList(items){$('listSummary').textContent=`${state.total}件`;const current=state.selected?.building_id;$('facilityList').innerHTML=items.map(x=>`<div class="facilityItem ${x.building_id===current?'selected':''}" onclick="selectFacility('${x.building_id}')"><b>${esc(x.name)}</b><div class="meta">${esc(x.address||'所在地未登録')}</div><div class="meta">整理番号 ${esc(x.legacy_serial_no||'－')} ・ ${x.status==='active'?'使用中':'廃止'}</div></div>`).join('')||'<div class="empty">該当なし</div>';const page=Math.floor(state.offset/state.limit)+1,totalPages=Math.max(1,Math.ceil(state.total/state.limit));$('pageInfo').textContent=`${page} / ${totalPages}`;$('prevBtn').disabled=state.offset===0;$('nextBtn').disabled=state.offset+state.limit>=state.total}
function changePage(dir){loadFacilities(state.offset+dir*state.limit)}
function drawingStatusLabel(status){
  return ({pending:'解析待ち',analyzed:'候補あり',reviewed:'レビュー済み',failed:'解析失敗'})[status]||status;
}


async function selectFacility(id){try{const [d,h,l,dash,ins,subs,equipment,drawings]=await Promise.all([api(`/facilities/${id}/detail`),api(`/facilities/${id}/history`),api(`/facilities/${id}/legacy-review`),api(`/facilities/${id}/dashboard`),api(`/inspections?building_id=${id}`),api(`/submissions?building_id=${id}`),api(`/facilities/${id}/equipment`),api(`/facilities/${id}/drawing-analyses`)]);state.selected=d.facility;state.detail=d;state.dashboard=dash;state.inspections=ins;state.submissions=subs;state.equipment=equipment;state.drawings=drawings;renderDetail(d,h,l,dash,ins,subs,equipment,drawings);await loadFacilities(state.offset)}catch(e){alert('対象物を取得できません: '+e.message)}}
function renderDetail(d,history,legacy,dash={},inspections=[],submissions=[],equipment=[],drawings=[]){$('noSelection').classList.add('hidden');$('detailView').classList.remove('hidden');const f=d.facility,x=d.detail||{},c=d.contact||{},floors=d.floors||[];const st=Object.fromEntries((dash.submission_statuses||[]).map(x=>[x.code,x]));const badge=(code,label)=>{const a=st[code],ok=a&&a.state!=='not_submitted';return `<div class="field"><label>${esc(label)}</label><div class="value"><span class="pill ${ok?'active':''}">${ok?'提出記録あり':'登録確認なし・要否未判定'}</span>${a?.latest_submitted_at?` <span class="muted">${esc(a.latest_submitted_at)}</span>`:''}</div></div>`};$('detailView').innerHTML=`<div class="card"><div class="hero"><div class="grow"><h1>${esc(f.name)}</h1><div class="muted">${esc(f.address||'所在地未登録')} ・ 整理番号 ${esc(f.legacy_serial_no||'－')} ・ Version ${f.version}</div></div><span class="pill ${f.status==='active'?'active':''}">${f.status==='active'?'使用中':'廃止'}</span></div><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="openEdit()" ${f.status!=='active'?'disabled':''}>編集</button>${f.status==='active'?`<button class="btn danger" onclick="changeFacilityState('abolish')">廃止</button>`:`<button class="btn" onclick="changeFacilityState('restore')">復元</button>`}</div></div>
<div class="card"><div class="sectionTitle">確認ダッシュボード</div><div class="grid3">${badge('equipment_inspection_report','消防用設備等点検結果報告')}${badge('fire_manager_appointment','防火管理者')}${badge('fire_plan','消防計画')}</div><div class="row" style="margin-top:10px"><span class="pill">査察 ${dash.inspections_total||0}件</span><span class="pill ${(dash.open_findings||0)>0?'dangerText':''}">未完了指摘 ${dash.open_findings||0}件</span><span class="muted">最終査察 ${esc(dash.latest_inspection_at||'未登録')}</span></div></div>
<div class="card"><div class="row"><div class="sectionTitle grow">査察履歴</div><button class="btn primary" onclick="quickAddInspection()">＋ 査察登録</button></div>${inspections.length?`<div class="scroll"><table><thead><tr><th>実施日</th><th>種別</th><th>状態</th><th>指摘</th></tr></thead><tbody>${inspections.map(i=>`<tr><td>${esc(i.inspected_at)}</td><td>${esc(i.inspection_type)}</td><td>${esc(i.status)}</td><td>${i.findings.length?i.findings.map(q=>`<div>${esc(q.finding_text)} <span class="pill">${esc(q.corrective_status)}</span>${q.corrective_status!=='completed'?` <button class="btn" onclick="completeFinding('${q.finding_id}',${q.version})">是正完了</button>`:''}</div>`).join(''):'－'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">査察履歴なし</div>'}</div>
<div class="card"><div class="row"><div class="sectionTitle grow">届出・報告受付</div><button class="btn primary" onclick="smartReceiveSubmission()">文書解析して受付</button><button class="btn" onclick="quickReceiveSubmission()">手動受付</button></div>${submissions.length?`<div class="scroll"><table><thead><tr><th>提出日</th><th>種別</th><th>届出番号</th><th>状態</th><th>原本</th></tr></thead><tbody>${submissions.map(s=>`<tr><td>${esc(s.submitted_at||s.received_at.slice(0,10))}</td><td>${esc(s.submission_type_name)}</td><td>${esc(s.official_number||'－')}</td><td>${esc(s.status)}</td><td>${s.document_ids.length}件</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">届出記録なし</div>'}</div>

<div class="card"><div class="sectionTitle">階別情報</div>${floors.length?`<div class="scroll"><table><thead><tr><th>階</th><th>床面積</th><th>用途</th><th>収容</th><th>従業員</th><th>無窓等</th><th>カーテン</th><th>絨毯</th><th>合板</th></tr></thead><tbody>${floors.map(fl=>`<tr><td>${esc(fl.floor_label||fl.floor_number+'階')}</td><td>${val(fl.floor_area)}</td><td>${val(fl.use_name)}</td><td>${val(fl.occupancy_count)}</td><td>${val(fl.employee_count)}</td><td>${val(fl.windowless_status)}</td><td>${val(fl.curtain_status)}</td><td>${val(fl.carpet_status)}</td><td>${val(fl.plywood_status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">階別情報なし</div>'}</div>

function kv(k,v){return `<div class="field"><label>${esc(k)}</label><div class="value">${val(v)}</div></div>`}function unit(v,u){return v===null||v===undefined||v===''?null:`${v}${u}`}function actionName(a){return ({'facility.create':'新規登録','facility.update':'編集','facility.abolish':'廃止','facility.restore':'復元'})[a]||a}function formatDate(s){try{return new Date(s).toLocaleString('ja-JP')}catch{return s}}

function openCreate(){state.mode='create';state.draft={facility:{name:'',phone:'',address:'',legacy_serial_no:'',version:0},detail:{},contact:{},floors:[]};openEditor(state.draft,'新規対象物')}
function openEdit(){if(!state.detail)return;state.mode='edit';state.draft=JSON.parse(JSON.stringify(state.detail));openEditor(state.draft,'対象物を編集')}
function openEditor(d,title){$('modalTitle').textContent=title;$('editNotice').innerHTML='';$('editFields').innerHTML=editorHtml(d);$('editModal').classList.remove('hidden')}
function closeEdit(){$('editModal').classList.add('hidden');state.draft=null}
function field(id,label,value,type='text'){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value??'')}"></div>`}
function editorHtml(d){const f=d.facility||{},x=d.detail||{},c=d.contact||{},floors=d.floors||[];return `<div class="card"><div class="sectionTitle">基本情報</div><div class="grid2">${field('e_name','名称',f.name)}${field('e_phone','電話番号',f.phone)}${field('e_address','所在地',f.address)}${field('e_serial','整理番号',f.legacy_serial_no)}${field('e_class','令別表区分',x.classification_code)}${field('e_class1','区分詳細1',x.classification_detail_1)}${field('e_class2','区分詳細2',x.classification_detail_2)}${field('e_book','旧台帳区分',x.legacy_book_type)}${field('e_asof','内容現在',x.content_as_of)}${field('e_zoning','用途地域',x.zoning)}${field('e_structure','構造',x.structure)}${field('e_a8','令8条区画',x.article8_partition)}${field('e_ag','地上階',x.above_ground_floors,'number')}${field('e_bg','地下階',x.basement_floors,'number')}${field('e_ba','建築面積',x.building_area,'number')}${field('e_ta','延べ面積',x.total_floor_area,'number')}</div></div><div class="card"><div class="sectionTitle">代表者</div><div class="grid2">${field('e_repname','氏名',c.representative_name)}${field('e_reptitle','役職',c.representative_title)}${field('e_repaddr','住所',c.representative_address)}${field('e_repphone','電話',c.representative_phone)}</div></div><div class="card"><div class="row"><div class="sectionTitle grow">階別情報</div><button class="btn" onclick="addFloorRow()">＋ 階追加</button></div><div class="scroll"><table><thead><tr><th>階番号</th><th>表示</th><th>面積</th><th>用途</th><th>収容</th><th>従業員</th><th>無窓等</th><th>カーテン</th><th>絨毯</th><th>合板</th><th></th></tr></thead><tbody id="floorRows">${floors.map((fl,i)=>floorEditRow(fl,i)).join('')}</tbody></table></div></div>`}
function floorEditRow(fl={},i){return `<tr data-floor-row><td><input style="width:70px" data-k="floor_number" type="number" value="${esc(fl.floor_number??i+1)}"></td><td><input style="width:90px" data-k="floor_label" value="${esc(fl.floor_label??'')}"></td><td><input style="width:100px" data-k="floor_area" type="number" value="${esc(fl.floor_area??'')}"></td><td><input data-k="use_name" value="${esc(fl.use_name??'')}"></td><td><input style="width:80px" data-k="occupancy_count" type="number" value="${esc(fl.occupancy_count??'')}"></td><td><input style="width:80px" data-k="employee_count" type="number" value="${esc(fl.employee_count??'')}"></td><td><input style="width:100px" data-k="windowless_status" value="${esc(fl.windowless_status??'')}"></td><td><input style="width:100px" data-k="curtain_status" value="${esc(fl.curtain_status??'')}"></td><td><input style="width:100px" data-k="carpet_status" value="${esc(fl.carpet_status??'')}"></td><td><input style="width:100px" data-k="plywood_status" value="${esc(fl.plywood_status??'')}"></td><td><button class="btn danger" onclick="this.closest('tr').remove()">削除</button></td></tr>`}
function addFloorRow(){const tb=$('floorRows'),i=tb.children.length;tb.insertAdjacentHTML('beforeend',floorEditRow({},i))}
function n(id){const v=$(id).value.trim();return v===''?null:Number(v)}function s(id){const v=$(id).value.trim();return v===''?null:v}
function readDraft(){const floors=[...document.querySelectorAll('[data-floor-row]')].map(r=>{const o={};r.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k,v=i.value.trim();o[k]=i.type==='number'?(v===''?null:Number(v)):(v===''?null:v)});return o});return {name:s('e_name'),phone:s('e_phone'),address:s('e_address'),legacy_serial_no:s('e_serial'),detail:{legacy_book_type:s('e_book'),content_as_of:s('e_asof'),classification_code:s('e_class'),classification_detail_1:s('e_class1'),classification_detail_2:s('e_class2'),zoning:s('e_zoning'),article8_partition:s('e_a8'),structure:s('e_structure'),above_ground_floors:n('e_ag'),basement_floors:n('e_bg'),building_area:n('e_ba'),total_floor_area:n('e_ta')},contact:{representative_name:s('e_repname'),representative_title:s('e_reptitle'),representative_address:s('e_repaddr'),representative_phone:s('e_repphone')},floors}}
async function saveFacility(){const p=readDraft();if(!p.name){$('editNotice').innerHTML='<div class="notice">名称は必須です。</div>';return}try{let r;if(state.mode==='create'){r=await api('/facilities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})}else{p.expected_version=state.detail.facility.version;r=await api(`/facilities/${state.detail.facility.building_id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})}closeEdit();await loadFacilities(state.offset);await selectFacility(r.building_id)}catch(e){if(e.status===409){renderConflict(e.body?.detail?.current,p);return}$('editNotice').innerHTML=`<div class="notice dangerText">保存できません: ${esc(e.message)}</div>`}}
function flatten(o,p='',out={}){if(o===null||typeof o!=='object'||Array.isArray(o)){out[p]=JSON.stringify(o);return out}for(const [k,v] of Object.entries(o))flatten(v,p?`${p}.${k}`:k,out);return out}
function renderConflict(current,local){const c=flatten(current||{}),l=flatten(local||{}),keys=[...new Set([...Object.keys(c),...Object.keys(l)])].filter(k=>c[k]!==l[k]&&/(name|address|phone|classification|structure|area|representative|floors)/.test(k)).slice(0,20);$('editNotice').innerHTML=`<div class="conflict"><b>他の職員が先に更新しています。</b><p class="muted">上書きは停止しました。最新データを読み直してから、必要な変更だけ再入力してください。</p>${keys.map(k=>`<div class="diffRow"><b>${esc(k)}</b><div>あなた: ${esc(l[k]??'')}</div><div>最新: ${esc(c[k]??'')}</div></div>`).join('')}<div style="margin-top:8px"><button class="btn" onclick="reloadConflict()">最新データを読み直す</button></div></div>`}
async function reloadConflict(){const id=state.detail.facility.building_id;const d=await api(`/facilities/${id}/detail`);state.detail=d;state.draft=JSON.parse(JSON.stringify(d));openEditor(state.draft,'対象物を編集（最新データ）')}
async function changeFacilityState(action){if(!state.detail)return;const label=action==='abolish'?'廃止':'復元';if(!confirm(`${state.detail.facility.name}を${label}しますか？`))return;try{const r=await api(`/facilities/${state.detail.facility.building_id}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:state.detail.facility.version})});await loadFacilities(state.offset);await selectFacility(r.building_id)}catch(e){if(e.status===409){alert('他の職員が先に更新しています。最新情報を読み直します。');await selectFacility(state.detail.facility.building_id);return}alert(`${label}できません: ${e.message}`)}}

async function quickAddInspection(){if(!state.detail)return;const inspected_at=prompt('査察実施日 YYYY-MM-DD',new Date().toISOString().slice(0,10));if(!inspected_at)return;const inspection_type=prompt('査察種別','定期査察')||'general';const finding=prompt('指摘事項（なければ空欄）','')||'';const payload={building_id:state.detail.facility.building_id,inspected_at,inspection_type,findings:finding?[{finding_text:finding,corrective_status:'open'}]:[]};try{await api('/inspections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});await selectFacility(state.detail.facility.building_id)}catch(e){alert('査察を登録できません: '+e.message)}}
async function completeFinding(id,version){try{await api(`/inspections/findings/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:version,corrective_status:'completed',completed_at:new Date().toISOString().slice(0,10)})});await selectFacility(state.detail.facility.building_id)}catch(e){alert('指摘事項を更新できません: '+e.message)}}
async function quickReceiveSubmission(){if(!state.detail)return;let types;try{types=await api('/submissions/types')}catch(e){alert('届出種別を取得できません: '+e.message);return}const menu=types.map((x,i)=>`${i+1}: ${x.name}`).join('\n');const choice=Number(prompt(`届出種別を番号で選択してください\n${menu}`,'1'));if(!choice||!types[choice-1])return;const type=types[choice-1];const official_number=prompt('正式届出番号（数字のみ。未取得なら空欄）','')||null;if(official_number&&!/^\d+$/.test(official_number)){alert('正式届出番号は数字のみです。');return}const submitted_at=prompt('提出日 YYYY-MM-DD',new Date().toISOString().slice(0,10));if(!submitted_at)return;const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.pdf,.jpg,.jpeg,.png,.webp,.tif,.tiff,.xlsx,.xlsm,.docx,.txt,.csv,.tsv';fileInput.onchange=async()=>{const file=fileInput.files?.[0];if(!file)return;try{const fd=new FormData();fd.append('file',file);fd.append('document_type','submission_source');fd.append('building_id',state.detail.facility.building_id);const doc=await api('/documents/upload',{method:'POST',body:fd});const payload={building_id:state.detail.facility.building_id,submission_type_code:type.code,official_number,submitted_at,document_ids:[doc.document_id],payload_data:{}};if(type.code==='fire_manager_appointment'){payload.payload_data.manager_name=prompt('防火管理者氏名（任意）','')||null}await api('/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});await selectFacility(state.detail.facility.building_id)}catch(e){alert('届出を受付できません: '+e.message)}};fileInput.click()}

async function smartReceiveSubmission(){if(!state.detail)return;const input=document.createElement('input');input.type='file';input.accept='.pdf,.jpg,.jpeg,.png,.webp,.tif,.tiff,.xlsx,.xlsm,.docx,.txt,.csv,.tsv';input.onchange=async()=>{const file=input.files?.[0];if(!file)return;try{const fd=new FormData();fd.append('file',file);fd.append('document_type','submission_source');const doc=await api('/documents/upload',{method:'POST',body:fd});const analysis=await api('/document-analyses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.document_id})});const method=analysis.extraction_method||'unknown',conf=analysis.confidence==null?'－':Math.round(analysis.confidence*100)+'%';alert(`文書解析完了\n抽出方式: ${method}\n書類種別候補: ${analysis.detected_submission_type_code||'判定できず'}\n信頼度: ${conf}\n\n正式登録はまだ行っていません。`);const candidates=analysis.facility_candidates||[];let buildingId=state.detail.facility.building_id;if(candidates.length){const menu=candidates.map((x,i)=>`${i+1}: ${x.name} / ${x.address||'所在地未登録'} / ${Math.round((x.score||0)*100)}%`).join('\n');const currentIndex=candidates.findIndex(x=>x.building_id===buildingId);const choice=Number(prompt(`対象物候補を確認してください\n${menu}\n\n0: 現在開いている対象物 ${state.detail.facility.name}`,currentIndex>=0?String(currentIndex+1):'0'));if(Number.isNaN(choice))return;if(choice>0&&candidates[choice-1])buildingId=candidates[choice-1].building_id}else if(!confirm(`対象物候補を自動特定できませんでした。\n現在開いている「${state.detail.facility.name}」としてレビューしますか？`)){return}const types=await api('/submissions/types');const detected=analysis.detected_submission_type_code;const defaultIndex=Math.max(0,types.findIndex(x=>x.code===detected));const typeMenu=types.map((x,i)=>`${i+1}: ${x.name}${x.code===detected?' [解析候補]':''}`).join('\n');const typeChoice=Number(prompt(`書類種別を確認してください\n${typeMenu}`,String(defaultIndex+1)));if(!typeChoice||!types[typeChoice-1])return;const type=types[typeChoice-1];const reviewed=await api(`/document-analyses/${analysis.document_analysis_id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:analysis.version,building_id:buildingId,submission_type_code:type.code})});const diffs=reviewed.difference_candidates||{};if(Object.keys(diffs).length){const diffText=Object.entries(diffs).map(([k,v])=>`${k}\n 現在: ${v.current??'－'}\n 読取: ${v.proposed??'－'}`).join('\n\n');alert(`台帳との差分候補があります。\nこの時点では台帳を変更しません。\n\n${diffText}`)}const official=prompt('正式届出番号（既存の番号取得システムで取得した数字のみ。未取得なら空欄）','')||null;if(official&&!/^\d+$/.test(official)){alert('正式届出番号は数字のみです。');return}const submitted=prompt('提出日 YYYY-MM-DD',new Date().toISOString().slice(0,10));if(!submitted)return;const payloadData={};if(type.code==='fire_manager_appointment'&&reviewed.detected_fields?.manager_name)payloadData.manager_name=reviewed.detected_fields.manager_name;if(!confirm(`受付を確定します。\n対象物ID: ${buildingId}\n種別: ${type.name}\n届出番号: ${official||'未登録'}\n提出日: ${submitted}\n\nよろしいですか？`))return;await api(`/document-analyses/${analysis.document_analysis_id}/confirm-receipt`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:reviewed.version,official_number:official,submitted_at:submitted,payload_data:payloadData})});const proposals=await api(`/document-analyses/${analysis.document_analysis_id}/change-proposals`);const pending=proposals.find(x=>x.status==='pending');if(pending){const accepted=[];for(const [path,diff] of Object.entries(pending.changes||{})){if(confirm(`台帳変更候補\n${path}\n現在: ${diff.current??'－'}\n読取: ${diff.proposed??'－'}\n\nこの項目を台帳へ反映しますか？`))accepted.push(path)}if(accepted.length){try{await api(`/facility-change-proposals/${pending.facility_change_proposal_id}/apply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:pending.version,expected_facility_version:pending.expected_facility_version,accepted_paths:accepted})})}catch(e){alert('台帳差分は反映されませんでした。対象物が他の職員に更新された可能性があります: '+e.message)}}}await loadFacilities(state.offset);await selectFacility(buildingId);alert('受付を登録しました。')}catch(e){alert('文書解析受付を完了できません: '+e.message)}};input.click()}

function draftCitationHtml(c){
  const p=c.provision||{};
  const label=[p.display_label,p.heading_text].filter(Boolean).join(' ')||p.provision_key||'条文';
  return '<div class="history"><b>'+esc(label)+'</b><div class="muted">'+esc(c.citation_role||'primary')+'</div><div>'+esc((p.body_text||'').slice(0,800))+'</div></div>';
}

async function loadLegalDrafts(){
  const box=$('legalReviewList');
  box.innerHTML='<div class="muted">Rule草案を読み込み中…</div>';
  const p=new URLSearchParams({limit:'100'});
  const status=$('legalDraftStatus').value;
  if(status)p.set('draft_status',status);
  try{
    const rows=await api('/legal-rule-drafts?'+p);
    state.legalDraftRows=rows;
    $('legalReviewSummary').textContent='Rule草案 '+rows.length+'件（最大100件）';
    box.innerHTML=rows.map(x=>{
      const domain=legalCategoryLabels[x.domain]||x.domain;
      let actions='';
      if(x.status==='pending'){
        actions='<button class="btn" onclick="openLegalDraftEdit(\''+x.legal_rule_draft_candidate_id+'\')">編集</button> '+
          '<button class="btn primary" onclick="reviewLegalDraft(\''+x.legal_rule_draft_candidate_id+'\','+x.version+',\'reviewed\')">レビュー完了</button> '+
          '<button class="btn" onclick="reviewLegalDraft(\''+x.legal_rule_draft_candidate_id+'\','+x.version+',\'rejected\')">却下</button>';
      }else if(x.status==='reviewed'){
        actions='<button class="btn primary" onclick="promoteLegalDraft(\''+x.legal_rule_draft_candidate_id+'\','+x.version+')">Draft Ruleへ昇格</button>';
      }else if(x.status==='promoted'){
        actions='<span class="pill active">Draft Rule '+esc(x.promoted_rule_version_id||'作成済み')+'</span>';
      }
      return '<div class="card">'+
        '<div class="row"><b class="grow">'+esc(x.proposed_name)+'</b><span class="pill">'+esc(domain)+'</span><span class="pill">'+esc(x.status)+'</span></div>'+
        '<div class="muted">Code: '+esc(x.proposed_rule_code||'未設定')+' ・ 抽出: '+esc(x.extraction_method)+' ・ Confidence: '+esc(x.confidence??'－')+'</div>'+
        '<details style="margin-top:8px"><summary>条件・結論</summary><pre>'+esc(JSON.stringify(x.proposed_conditions||{},null,2))+'</pre><pre>'+esc(JSON.stringify(x.proposed_outcome||{},null,2))+'</pre></details>'+
        (x.rationale?'<div class="muted">メモ: '+esc(x.rationale)+'</div>':'')+
        (x.citations||[]).map(draftCitationHtml).join('')+
        '<div class="row" style="margin-top:10px">'+actions+'</div></div>';
    }).join('')||'<div class="empty">該当するRule草案はありません。</div>';
  }catch(e){
    $('legalReviewSummary').textContent='';
    box.innerHTML='<div class="conflict">Rule草案を取得できません: '+esc(e.message)+'</div>';
  }
}

function openLegalDraftEdit(id){
  const row=(state.legalDraftRows||[]).find(x=>x.legal_rule_draft_candidate_id===id);
  if(!row)return;
  state.legalDraftEditId=id;
  state.legalDraftEditVersion=row.version;
  $('legalDraftCode').value=row.proposed_rule_code||'';
  $('legalDraftName').value=row.proposed_name||'';
  $('legalDraftConditions').value=JSON.stringify(row.proposed_conditions||{},null,2);
  $('legalDraftOutcome').value=JSON.stringify(row.proposed_outcome||{},null,2);
  $('legalDraftRationale').value=row.rationale||'';
  $('legalDraftEditMsg').textContent='';
  $('legalDraftEditModal').classList.remove('hidden');
}
function closeLegalDraftEdit(){$('legalDraftEditModal').classList.add('hidden')}

async function saveLegalDraftEdit(){
  let conditions,outcome;
  try{
    conditions=JSON.parse($('legalDraftConditions').value||'{}');
    outcome=JSON.parse($('legalDraftOutcome').value||'{}');
  }catch(e){$('legalDraftEditMsg').textContent='JSON形式を確認してください。';return}
  try{
    await api('/legal-rule-drafts/'+state.legalDraftEditId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      expected_version:state.legalDraftEditVersion,
      proposed_rule_code:$('legalDraftCode').value.trim()||null,
      proposed_name:$('legalDraftName').value.trim(),
      proposed_conditions:conditions,
      proposed_outcome:outcome,
      rationale:$('legalDraftRationale').value
    })});
    closeLegalDraftEdit();
    await loadLegalDrafts();
  }catch(e){$('legalDraftEditMsg').textContent='保存できません: '+e.message}
}

async function reviewLegalDraft(id,version,nextStatus){
  try{
    await api('/legal-rule-drafts/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:version,status:nextStatus})});
    await loadLegalDrafts();
  }catch(e){alert('Reviewできません: '+e.message)}
}

async function promoteLegalDraft(id,version){
  const from=prompt('適用開始日 YYYY-MM-DD');
  if(!from)return;
  const to=prompt('適用終了日 YYYY-MM-DD（なければ空欄）','');
  try{
    await api('/legal-rule-drafts/'+id+'/promote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:version,effective_from:from,effective_to:to||null})});
    await loadLegalDrafts();
    alert('Draft Rule Versionへ昇格しました。正式承認はまだ行われていません。');
  }catch(e){alert('Draft Ruleへ昇格できません: '+e.message)}
}

};

  $('legalReviewModal').classList.remove('hidden');
  legalReviewState.offset=0;
  await loadLegalReview(0);
}

function legalReasonText(reasons){
  return (reasons||[]).map(x=>{
    if(typeof x==='string')return x;
    return x.match||x.source_priority||JSON.stringify(x);
  }).join(' / ');
}

async function loadLegalReview(offset=legalReviewState.offset){
  legalReviewState.offset=Math.max(0,offset);
  const box=$('legalReviewList');
  box.innerHTML='<div class="muted">読み込み中…</div>';
  const status=$('legalReviewStatus').value;
  const category=$('legalReviewCategory').value;
  const lane=$('legalReviewLane').value;
  const context=$('legalReviewContext').value;
  const q=$('legalReviewQ').value.trim();
  const minScore=$('legalReviewMinScore').value;
  const minPriority=$('legalReviewMinPriority').value;

  const p=new URLSearchParams({
    limit:String(legalReviewState.limit),
    offset:String(legalReviewState.offset)
  });
  const summaryParams=new URLSearchParams();
  if(status)p.set('queue_status',status); else p.set('queue_status','');
  if(category){p.set('category',category);summaryParams.set('category',category)}
  if(lane){p.set('priority_lane',lane);summaryParams.set('priority_lane',lane)}
  if(context){p.set('provision_context',context);summaryParams.set('provision_context',context)}
  if(q){p.set('q',q);summaryParams.set('q',q)}
  if(minScore){p.set('min_score',minScore);summaryParams.set('min_score',minScore)}
  if(minPriority){p.set('min_review_priority',minPriority);summaryParams.set('min_review_priority',minPriority)}

  try{
    const [rows,summary,coverage]=await Promise.all([
      api('/legal-review-queue?'+p),
      api('/legal-review-queue/summary?'+summaryParams),
      api('/legal-rules/coverage')
    ]);
    const sumStates=obj=>Object.values(obj||{}).reduce((a,b)=>a+Number(b||0),0);
    const renderCoverageDomain=(domain,label)=>{
      const queue=coverage.review_queue_by_domain_status?.[domain]||{};
      const drafts=coverage.draft_candidates_by_domain_status?.[domain]||{};
      const versions=coverage.rule_versions_by_domain_status?.[domain]||{};
      const approved=coverage.approved_rule_count_by_domain?.[domain]||0;
      return '<div class="card" style="margin:0"><b>'+esc(label)+'</b>'+
        '<div class="muted">条文候補 '+sumStates(queue)+'件 ・ Rule草案 '+sumStates(drafts)+'件 ・ Rule Version '+sumStates(versions)+'件 ・ 承認済Rule '+esc(approved)+'件</div></div>';
    };
    $('legalCoverageStats').innerHTML=
      renderCoverageDomain('equipment_requirement','必要設備')+
      renderCoverageDomain('submission_requirement','必要届出')+
      '<div class="muted" style="grid-column:1/-1">※ 件数は作業進捗です。法令の網羅率を意味しません。</div>';
    const statusTotal=status?(summary.by_status?.[status]||0):summary.total;
    legalReviewState.total=statusTotal;
    const page=Math.floor(legalReviewState.offset/legalReviewState.limit)+1;
    const pages=Math.max(1,Math.ceil(statusTotal/legalReviewState.limit));
    $('legalReviewSummary').textContent='対象 '+statusTotal+'件 ・ 表示 '+rows.length+'件';
    $('legalReviewStats').innerHTML=
      '<span class="pill">全体 '+esc(summary.total)+'</span>'+
      '<span class="pill">未確認 '+esc(summary.by_status?.pending||0)+'</span>'+
      '<span class="pill">レビュー済み '+esc(summary.by_status?.reviewed||0)+'</span>'+
      '<span class="pill active">草案化 '+esc(summary.by_status?.drafted||0)+'</span>'+
      '<span class="pill">対象外 '+esc(summary.by_status?.ignored||0)+'</span>';
    $('legalReviewPageInfo').textContent=page+' / '+pages;
    $('legalReviewPrev').disabled=legalReviewState.offset===0;
    $('legalReviewNext').disabled=legalReviewState.offset+legalReviewState.limit>=statusTotal;
    box.innerHTML=rows.map(x=>{
      const p=x.provision||{};
      const label=[p.display_label,p.heading_text].filter(Boolean).join(' ')||p.provision_key||'条文';
      const laneLabel=legalLaneLabels[x.priority_lane]||x.priority_lane;
      const catLabel=legalCategoryLabels[x.category]||x.category;
      const body=(p.body_text||'').length>1200?(p.body_text||'').slice(0,1200)+'…':(p.body_text||'');
      let actions='';
      if(x.status==='pending'){
        actions='<button class="btn primary" onclick="updateLegalReview(\''+x.legal_provision_review_candidate_id+'\','+x.version+',\'reviewed\')">レビュー済み</button> '+
          '<button class="btn" onclick="updateLegalReview(\''+x.legal_provision_review_candidate_id+'\','+x.version+',\'ignored\')">対象外</button>';
      }else if(x.status==='reviewed' && (x.category==='equipment_requirement'||x.category==='submission_requirement')){
        actions='<button class="btn primary" onclick="draftLegalRuleFromReview(\''+x.legal_provision_review_candidate_id+'\','+x.version+',\''+esc(label).replace(/'/g,"&#039;")+'\')">Rule草案へ</button>';
      }else if(x.status==='drafted'){
        actions='<span class="pill active">Rule草案 '+esc(x.legal_rule_draft_candidate_id||'作成済み')+'</span>';
      }
      return '<div class="card">'+
        '<div class="row"><b class="grow">'+esc(x.document_title)+'</b>'+
        '<span class="pill">'+esc(laneLabel)+'</span><span class="pill">'+esc(catLabel)+'</span></div>'+
        '<div class="muted">'+esc(label)+' ・ 関連度 '+esc(x.relevance_score)+' ・ Source優先 '+esc(x.source_priority_score)+' ・ 文脈 '+esc(x.provision_context||'main')+' ('+esc(x.context_priority_score||0)+') ・ 総合 '+esc(x.review_priority_score)+'</div>'+
        '<div class="value">'+esc(body||'本文なし')+'</div>'+
        '<div class="muted">抽出根拠: '+esc(legalReasonText(x.reasons))+'</div>'+
        '<div class="row" style="margin-top:10px">'+actions+'</div>'+
        '</div>';
    }).join('')||'<div class="empty">該当候補はありません。</div>';
  }catch(e){
    $('legalReviewSummary').textContent='';
    $('legalReviewStats').innerHTML='';
    $('legalCoverageStats').innerHTML='';
    $('legalReviewPageInfo').textContent='';
    box.innerHTML='<div class="conflict">法令レビュー候補を取得できません: '+esc(e.message)+'</div>';
  }
}

async function runSubmissionCompliance(){
  if(!state.selected)return;
  const box=$('submissionComplianceResult');
  box.innerHTML='必要届出と受付記録を照合中…';
  try{
    const r=await api('/facilities/'+state.selected.building_id+'/submission-compliance/evaluate',{method:'POST'});
    const stateLabel={
      modern_submission_recorded:'正式受付記録あり',
      missing_record_candidate:'記録なし候補',
      legacy_evidence_only:'旧台帳証拠のみ',
      manual_review_required:'要人確認'
    };
    const items=(r.items||[]).map(x=>{
      const rules=(x.rule_evidence||[]).map(rule=>{
        const citations=(rule.citations||[]).map(c=>[c.display_label,c.heading_text].filter(Boolean).join(' ')||c.provision_key).join(' / ');
        return '<div class="muted">Rule '+esc(rule.rule_code)+' v'+esc(rule.version_no)+(citations?' ・ '+esc(citations):'')+'</div>';
      }).join('');
      const latest=x.latest_submitted_at?' ・ '+esc(x.latest_submitted_at):'';
      return '<div class="history"><b>'+esc(x.submission_type_name||x.submission_type_code)+'</b> '+
        '<span class="pill">'+esc(stateLabel[x.state]||x.state)+'</span>'+latest+
        rules+
        (x.detail?.reason?'<div class="muted">'+esc(x.detail.reason)+'</div>':'')+
        '</div>';
    }).join('');
    const unmapped=(r.unmapped_rules||[]).length
      ? '<div class="notice">自動照合できないRule '+esc(r.unmapped_rules.length)+'件。Rule outcomeの明示設定または人確認が必要です。</div>'
      : '';
    box.innerHTML=
      '<div class="row"><span class="pill">一致Rule '+esc(r.matched_rule_count)+'</span>'+
      '<span class="pill">自動照合 '+esc(r.actionable_rule_count)+'</span>'+
      '<span class="pill">記録なし候補 '+esc(r.gap_candidate_count)+'</span>'+
      '<span class="pill">要確認 '+esc(r.manual_review_count)+'</span></div>'+
      unmapped+
      (items||'<div class="muted">照合対象となる承認済Ruleはありません。</div>')+
      '<div class="muted">'+esc(r.note)+'</div>';
  }catch(e){
    box.innerHTML='<div class="conflict">届出照合できません: '+esc(e.message)+'</div>';
  }
}

async function createFireCase(){
  const title=prompt('火災調査Caseの件名');
  if(!title)return;
  const caseNumber=prompt('事案番号（未定なら空欄）','')??'';
  const occurred=prompt('発生日時（ISO形式。未定なら空欄）','')??'';
  const location=prompt('発生場所','')??'';
  let buildingId=null;
  if(state.selected && confirm('現在選択中の対象物「'+state.selected.name+'」へ紐付けますか？'))buildingId=state.selected.building_id;
  try{
    const row=await api('/fire-investigations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      case_number:caseNumber.trim()||null,
      building_id:buildingId,
      title,
      occurred_at:occurred.trim()||null,
      location_text:location.trim()||null
    })});
    await loadFireCases();
    await openFireCase(row.fire_investigation_case_id);
  }catch(e){alert('火災調査Caseを作成できません: '+e.message)}
}
async function openFireCase(id){
  try{
    const d=await api('/fire-investigations/'+id);
    fireState.caseId=id;
    fireState.detail=d;
    await loadFireCases();
    renderFireCase(d);
    await loadFireEvidenceComparisons();
  }catch(e){$('fireCaseDetail').innerHTML='<div class="conflict">Caseを取得できません: '+esc(e.message)+'</div>'}
}

function fireUncertaintyText(markers){
  return (markers||[]).map(x=>x.text||x.type).filter(Boolean).join(' / ');

async function searchFireTranscripts(){
  if(!fireState.caseId)return;
  const box=$('fireTranscriptSearchResults');
  const q=$('fireTranscriptSearchQ').value.trim();
  if(!q){box.innerHTML='<span class="muted">検索語を入力してください。</span>';return}
  const p=new URLSearchParams({q,accepted_only:'true',limit:'100'});
  const speaker=$('fireTranscriptSpeaker').value.trim();
  if(speaker)p.set('speaker_label',speaker);
  if($('fireTranscriptUncertainOnly').checked)p.set('uncertain_only','true');
  box.innerHTML='検索中…';
  try{
    const rows=await api('/fire-investigations/'+fireState.caseId+'/transcript-search?'+p);
    box.innerHTML=rows.map(x=>{
      const s=x.segment||{};
      const uncertainty=fireUncertaintyText(s.uncertainty_markers);
      return '<div class="history"><div class="row"><b>'+esc(s.speaker_label||'話者未設定')+'</b><span class="pill">Score '+esc(x.search_score)+'</span>'+(uncertainty?'<span class="pill">不確実表現あり</span>':'')+'</div>'+
        '<div class="muted">'+esc(Math.round((s.start_ms||0)/1000))+'秒〜'+esc(Math.round((s.end_ms||0)/1000))+'秒</div>'+

        '<div class="muted">Segment '+esc(s.fire_transcript_segment_id||'')+'</div></div>';
    }).join('')||'<div class="muted">該当する確認済み文字起こしはありません。</div>';
  }catch(e){box.innerHTML='<div class="conflict">文字起こし検索に失敗: '+esc(e.message)+'</div>'}
}
function fireEvidenceRefText(ref){
  if(!ref)return '－';
  if(ref.type==='transcript_segment')return '文字起こし: '+(ref.speaker_label||'話者未設定')+' / '+(ref.text||'');
  if(ref.type==='statement')return '供述: '+(ref.person_label||'人物未設定')+' / '+(ref.text||'');
  if(ref.type==='timeline_event')return 'タイムライン: '+(ref.title||'')+' / '+(ref.event_time_text||ref.event_time||'');
  return (ref.type||'Evidence')+': '+(ref.id||'');
}

function triggerFireMediaUpload(type){
  if(!fireState.caseId)return;
  fireState.mediaType=type;

async function uploadFireMediaFile(event){
  const file=event.target.files?.[0];
  if(!file||!fireState.caseId)return;
  try{
    const fd=new FormData();
    fd.append('file',file);
    fd.append('document_type',fireState.mediaType==='photo'?'fire_scene_photo':'fire_interview_audio');
    const doc=await api('/documents/upload',{method:'POST',body:fd});
    await api('/fire-investigations/'+fireState.caseId+'/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      document_id:doc.document_id,
      media_type:fireState.mediaType
    })});

function firePhotoQualityLabel(flags){
  if(!flags||!flags.length)return '品質警告なし';
  const labels={
    low_resolution:'低解像度候補',
    too_dark_candidate:'暗すぎる候補',
    too_bright_candidate:'明るすぎる候補',
    low_contrast_candidate:'低コントラスト候補',
    low_sharpness_candidate:'不鮮明候補'
  };
  return flags.map(x=>labels[x]||x).join(' / ');
}

function renderDrawingAnalysis(d){
  const a=d.analysis;
  const equipment=(d.equipment_candidates||[]);
  const facts=(d.fact_candidates||[]);
  const elements=(d.elements||[]);
  const eqHtml=equipment.length?equipment.map(x=>{
    let actions='';
    if(x.status==='pending'){
      actions='<button class="btn primary" onclick="reviewDrawingEquipment(\''+x.drawing_equipment_candidate_id+'\','+x.version+',\'accepted\')">承認</button> <button class="btn" onclick="reviewDrawingEquipment(\''+x.drawing_equipment_candidate_id+'\','+x.version+',\'rejected\')">却下</button>';
    }else if(x.status==='accepted'){
      actions='<button class="btn primary" onclick="promoteDrawingEquipment(\''+x.drawing_equipment_candidate_id+'\','+x.version+',\''+esc(x.suggested_equipment_type_code||'').replace(/'/g,"&#039;")+'\')">設備候補へ昇格</button>';
    }else if(x.status==='promoted'){
      actions='<span class="pill active">設備台帳候補化済み</span>';
    }
    return '<div class="history"><b>'+esc(x.suggested_label||x.suggested_equipment_type_code||'設備候補')+'</b> <span class="pill">'+esc(x.status)+'</span>'+
      '<div class="muted">階 '+esc(x.floor_number??'－')+' ・ 場所 '+esc(x.location_text||'－')+' ・ 数量 '+esc(x.quantity??'－')+' ・ 信頼度 '+esc(x.confidence===null||x.confidence===undefined?'－':Math.round(x.confidence*100)+'%')+'</div>'+
      '<div class="row" style="margin-top:8px">'+actions+'</div></div>';
  }).join(''):'<div class="muted">設備候補なし</div>';

  const factHtml=facts.length?facts.map(x=>{
    let actions='';
    if(x.status==='pending'){
      actions='<button class="btn primary" onclick="reviewDrawingFact(\''+x.drawing_fact_candidate_id+'\','+x.version+',\'accepted\')">承認</button> <button class="btn" onclick="reviewDrawingFact(\''+x.drawing_fact_candidate_id+'\','+x.version+',\'rejected\')">却下</button>';
    }else if(x.status==='accepted'&&!x.applied_at){
      actions='<button class="btn primary" onclick="applyDrawingFact(\''+x.drawing_fact_candidate_id+'\','+x.version+')">対象物へ反映</button>';
    }else if(x.applied_at){
      actions='<span class="pill active">対象物へ反映済み</span>';
    }
    return '<div class="history"><b>'+esc(x.target_path)+'</b> <span class="pill">'+esc(x.status)+'</span>'+
      '<div class="value">'+esc(JSON.stringify(x.proposed_value))+'</div>'+
      '<div class="muted">信頼度 '+esc(x.confidence===null||x.confidence===undefined?'－':Math.round(x.confidence*100)+'%')+'</div>'+
      '<div class="row" style="margin-top:8px">'+actions+'</div></div>';
  }).join(''):'<div class="muted">対象物情報候補なし</div>';

  const elementHtml=elements.length?'<details><summary>抽出要素 '+elements.length+'件</summary><div class="scroll"><table><thead><tr><th>頁</th><th>種別</th><th>ラベル</th><th>階</th><th>信頼度</th></tr></thead><tbody>'+
    elements.map(x=>'<tr><td>'+esc(x.page_no)+'</td><td>'+esc(x.element_type)+'</td><td>'+esc(x.label||'－')+'</td><td>'+esc(x.floor_number??'－')+'</td><td>'+esc(x.confidence===null||x.confidence===undefined?'－':Math.round(x.confidence*100)+'%')+'</td></tr>').join('')+
    '</tbody></table></div></details>':'';

  let reviewButton='';
  if(a.status!=='reviewed'){
    reviewButton='<button class="btn" onclick="reviewDrawingAnalysis(\''+a.drawing_analysis_id+'\','+a.version+')">解析レビュー完了</button>';
  }
  $('drawingReviewBody').innerHTML=
    '<div class="row"><b class="grow">'+esc(drawingStatusLabel(a.status))+'</b><span class="pill">'+esc(a.analysis_method)+'</span>'+reviewButton+'</div>'+
    '<div class="notice">設備候補の昇格後も verification_status=ai_candidate です。別途、現地または正式書類で確認して初めてverifiedにできます。</div>'+
    '<div class="grid2"><div class="card"><div class="sectionTitle">設備候補</div>'+eqHtml+'</div><div class="card"><div class="sectionTitle">対象物情報候補</div>'+factHtml+'</div></div>'+
    elementHtml;
}

async function runEquipmentCompliance(){
  if(!state.selected)return;
  const box=$('equipmentComplianceResult');
  box.innerHTML='必要設備と設置設備を照合中…';
  try{
    const r=await api('/facilities/'+state.selected.building_id+'/equipment-compliance/evaluate',{method:'POST'});
    const stateLabel={
      verified_installed:'確認済み設置記録あり',
      missing_equipment_candidate:'設置記録なし候補',
      unverified_evidence_only:'未確認・AI・旧データ証拠のみ',
      manual_review_required:'要人確認'
    };
    const items=(r.items||[]).map(x=>{
      const rules=(x.rule_evidence||[]).map(rule=>{
        const citations=(rule.citations||[]).map(c=>[c.display_label,c.heading_text].filter(Boolean).join(' ')||c.provision_key).join(' / ');
        return '<div class="muted">Rule '+esc(rule.rule_code)+' v'+esc(rule.version_no)+(citations?' ・ '+esc(citations):'')+'</div>';
      }).join('');
      return '<div class="history"><b>'+esc(x.equipment_type_name||x.equipment_type_code)+'</b> '+
        '<span class="pill">'+esc(stateLabel[x.state]||x.state)+'</span>'+
        rules+
        (x.detail?.reason?'<div class="muted">'+esc(x.detail.reason)+'</div>':'')+
        '</div>';
    }).join('');
    const unmapped=(r.unmapped_rules||[]).length
      ? '<div class="notice">自動照合できない設備Rule '+esc(r.unmapped_rules.length)+'件。Rule outcomeの明示設定または人確認が必要です。</div>'
      : '';
    box.innerHTML=
      '<div class="row"><span class="pill">一致Rule '+esc(r.matched_rule_count)+'</span>'+
      '<span class="pill">自動照合 '+esc(r.actionable_rule_count)+'</span>'+
      '<span class="pill">設置記録なし候補 '+esc(r.gap_candidate_count)+'</span>'+
      '<span class="pill">要確認 '+esc(r.manual_review_count)+'</span></div>'+
      unmapped+
      (items||'<div class="muted">照合対象となる承認済Ruleはありません。</div>')+
      '<div class="muted">'+esc(r.note)+'</div>';
  }catch(e){
    box.innerHTML='<div class="conflict">設備照合できません: '+esc(e.message)+'</div>';
  }
}

async function runRequirementEvaluation(domain){
  if(!state.selected)return;
  const box=$('ruleEvalResult');
  box.innerHTML='判定中…';
  try{
    const r=await api('/legal-rules/evaluate/'+state.selected.building_id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain})});
    if(!r.results.length){box.innerHTML='<span class="pill active">候補なし</span> 承認済みルールで該当候補はありません。';return}
    box.innerHTML=r.results.map(x=>{
      const o=x.outcome||{};
      const label=o.requirement_name||o.label||o.requirement_code||x.rule_name;
      const source=x.source_reference||'登録済み原本参照';
      const evidence=[...(x.evidence?.all||[]),...(x.evidence?.any||[])].filter(e=>e.matched).map(e=>esc(e.field)+'='+esc(e.actual)).join(' / ');
      const citations=(x.citations||[]).map(c=>{
        const label=[c.display_label,c.heading_text].filter(Boolean).join(' ');
        return '<div class="muted">法的根拠 ['+esc(c.role)+'] '+esc(label||c.provision_key)+'</div>'+
          (c.body_text?'<details><summary>条文本文を確認</summary><div class="value">'+esc(c.body_text)+'</div></details>':'');
      }).join('');
      return '<div class="history"><b>候補: '+esc(label)+'</b><div class="muted">Rule '+esc(x.rule_code)+' v'+esc(x.version_no)+' ・ '+esc(source)+'</div>'+citations+'<div class="muted">一致根拠: '+(evidence||'－')+'</div><span class="pill">職員確認待ち</span></div>';
    }).join('');
  }catch(e){box.innerHTML='<span class="dangerText">判定できません: '+esc(e.message)+'</span>'}
}
</script>
</body>
</html>
