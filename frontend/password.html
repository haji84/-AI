<!doctype html><html lang="ja"><head><script src="/ui/auth-session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パスワード更新 | 消防業務AI</title><style>body{font-family:system-ui,sans-serif;background:#f3f5f8;color:#182332;max-width:640px;margin:auto;padding:24px}section{background:white;border:1px solid #dce2ea;border-radius:10px;padding:20px;margin-top:16px}label{display:block;margin:14px 0}input,button{font:inherit;padding:10px;border:1px solid #b6c0ce;border-radius:5px}input{display:block;width:90%;margin-top:5px}button{background:#174c77;color:white}#message{padding:12px;background:#e7eef7}[hidden]{display:none!important}</style></head><body><h1>パスワード更新</h1><p>有効期限が切れた場合は、更新するまで業務操作を利用できません。更新後は全セッションが失効し、新しいパスワードでログインします。</p><div id="message" role="status" aria-live="polite">認証状態を確認しています。</div><section id="loginSection"><h2>本人確認</h2><form id="loginForm"><label>ログインID<input name="username" required autocomplete="username"></label><label>現在のパスワード<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button>ログイン</button></form></section><section id="renewSection" hidden><h2 id="account"></h2><p>12〜128文字。現在と直近5世代のパスワードは再利用できません。</p><form id="renewForm"><label>現在のパスワード<input name="current_password" type="password" required maxlength="128" autocomplete="current-password"></label><label>新しいパスワード<input name="new_password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>新しいパスワード（確認）<input name="confirmation" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button>パスワードを更新</button></form><button id="logoutButton">ログアウト</button></section><p><a id="businessLink" href="/ui/" hidden>業務画面へ</a></p><script src="/ui/password.js"></script></body></html>
