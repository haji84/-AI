name: AIOS autonomous backlog bootstrap
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: aios-autonomy-backlog
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'haji84/-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create bounded, deduplicated investigation issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/autonomy/backlog.py --repo . --publish
