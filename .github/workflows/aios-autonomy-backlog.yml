name: AIOS autonomous backlog bootstrap
on:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: aios-autonomy-backlog
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'haji84/-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create bounded, deduplicated investigation issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/autonomy/backlog.py --repo . --publish --output "$RUNNER_TEMP/aios-autonomy-backlog.json"
      - name: Upload bounded Issue discovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autonomy-backlog
          path: ${{ runner.temp }}/aios-autonomy-backlog.json
          retention-days: 7
