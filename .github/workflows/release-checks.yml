name: release-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runtime-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build hash-locked wheel-only runtime bundle
        run: >-
          python scripts/build_offline_wheelhouse.py build
          --project backend/pyproject.toml
          --lock backend/requirements-release.lock
          --wheelhouse "${RUNNER_TEMP}/fire-ai-runtime-wheelhouse"
          --implementation cp
          --python-version 3.11
          --abi cp311
          --platform manylinux_2_34_x86_64
      - name: Reverify offline bundle without package index
        env:
          PIP_NO_INDEX: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/fire-ai-runtime-wheelhouse"
          python scripts/build_offline_wheelhouse.py verify \
            --project backend/pyproject.toml \
            --lock backend/requirements-release.lock \
            --wheelhouse "$wheelhouse" \
            --implementation cp \
            --python-version 3.11 \
            --abi cp311 \
            --platform manylinux_2_34_x86_64
          python -m venv "${RUNNER_TEMP}/fire-ai-offline-venv"
          "${RUNNER_TEMP}/fire-ai-offline-venv/bin/python" -m pip install \
            --no-index --find-links "$wheelhouse" --require-hashes \
            --requirement backend/requirements-release.lock
          FIRE_AI_PRODUCTION_MODE=false \
          FIRE_AI_COOKIE_SECURE=false \
          FIRE_AI_DATABASE_URL="sqlite+pysqlite:///${RUNNER_TEMP}/fire-ai-offline-smoke.db" \
          FIRE_AI_STORAGE_ROOT="${RUNNER_TEMP}/fire-ai-offline-storage" \
          PYTHONPATH=backend \
            "${RUNNER_TEMP}/fire-ai-offline-venv/bin/python" - <<'PY'
          from app.main import app

          paths = {
              path for route in app.routes
              if (path := getattr(route, "path", None))
          }
          assert app.title
          assert "/health" in paths
          print(f"offline app import ok: {app.title}; routes={len(paths)}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-wheelhouse-cp311-manylinux-2-34-x86-64
          path: ${{ runner.temp }}/fire-ai-runtime-wheelhouse
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
