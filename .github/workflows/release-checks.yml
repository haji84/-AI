name: release-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runtime-wheelhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build hash-locked wheel-only runtime bundle
        run: >-
          python scripts/build_offline_wheelhouse.py build
          --project backend/pyproject.toml
          --lock backend/requirements-release.lock
          --wheelhouse "${RUNNER_TEMP}/fire-ai-runtime-wheelhouse"
          --implementation cp
          --python-version 3.11
          --abi cp311
          --platform manylinux_2_34_x86_64
      - name: Build unified source and wheel release set
        env:
          PIP_NO_INDEX: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          wheelhouse="${RUNNER_TEMP}/fire-ai-runtime-wheelhouse"
          source_bundle="${RUNNER_TEMP}/fire-ai-source.tar.gz"
          release_set="${RUNNER_TEMP}/fire-ai-release-set"
          managed_root="${RUNNER_TEMP}/fire-ai-managed-rehearsal"
          commit="$(git rev-parse HEAD)"
          python scripts/build_offline_wheelhouse.py verify \
            --project backend/pyproject.toml \
            --lock backend/requirements-release.lock \
            --wheelhouse "$wheelhouse" \
            --implementation cp \
            --python-version 3.11 \
            --abi cp311 \
            --platform manylinux_2_34_x86_64
          python scripts/build_release_bundle.py build \
            --repo . --ref "$commit" --release-id "fire-ai-${commit}" \
            --output "$source_bundle"
          python scripts/build_release_set.py build \
            --source-bundle "$source_bundle" --wheelhouse "$wheelhouse" \
            --output "$release_set" --implementation cp --python-version 3.11 \
            --abi cp311 --platform manylinux_2_34_x86_64
          python scripts/build_release_set.py verify "$release_set" \
            --expected-commit "$commit"
          # The consumer itself enforces PIP_NO_INDEX, --no-index and --require-hashes.
          python scripts/build_release_set.py install "$release_set" \
            --managed-root "$managed_root" --python "$(command -v python)" \
            --expected-commit "$commit"
          python scripts/build_release_set.py install "$release_set" \
            --managed-root "$managed_root" --python "$(command -v python)" \
            --expected-commit "$commit"
          python scripts/build_release_set.py rollback --managed-root "$managed_root"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set-cp311-manylinux-2-34-x86-64
          path: ${{ runner.temp }}/fire-ai-release-set
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
