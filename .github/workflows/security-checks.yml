name: security-checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [
      "acquire-egov-national-laws",
      "acquire-oshima-official-regulations",
      "acquire-oshima-reiki-fast",
      "autonomy-controller-bootstrap",
      "build-core-legal-authoring-worklist",
      "build-occupancy-classification-worklist",
      "dependency-checks",
      "project-checks",
      "release-checks",
      "verify-fire-legal-review-queue",
      "verify-legal-structure-corpora",
    ]
    types: [completed]
  workflow_dispatch:
    inputs:
      historical:
        description: Discover the complete historical inventory and audit the next bounded batch
        required: false
        default: false
        type: boolean
      history_after_pull_request:
        description: Last successfully audited historical pull request number, or 0
        required: false
        default: '0'
        type: string
      history_after_workflow_run:
        description: Last successfully audited historical workflow run ID, or 0
        required: false
        default: '0'
        type: string
      history_pull_request_limit:
        description: Historical pull requests to audit in this batch (1-100)
        required: false
        default: '10'
        type: string
      history_workflow_run_limit:
        description: Historical workflow runs to audit in this batch (1-100)
        required: false
        default: '1'
        type: string
      history_cursor_sha256:
        description: Exact cursor-prefix SHA-256 emitted by the preceding historical batch
        required: false
        type: string
      history_through_pull_request:
        description: Fixed PR snapshot ceiling emitted by the first historical batch, or 0
        required: false
        default: '0'
        type: string
      history_through_workflow_run:
        description: Fixed run snapshot ceiling emitted by the first historical batch, or 0
        required: false
        default: '0'
        type: string
      history_snapshot_initialized:
        description: Continue the exact snapshot emitted by the first historical batch
        required: false
        default: false
        type: boolean
      history_snapshot_sha256:
        description: Exact membership SHA-256 emitted by the first historical batch
        required: false
        type: string
      pull_requests:
        description: Exact comma-separated pull request numbers to audit
        required: false
        type: string
      workflow_runs:
        description: Exact comma-separated completed workflow run IDs to audit
        required: false
        type: string

permissions:
  contents: read

jobs:
  secret-scan:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-secret-scanner
      - name: Scan fetched Git history and working tree
        run: python scripts/security_scan.py --repository . --gitleaks "$FIRE_AI_GITLEAKS_BIN"

  published-surface-audit:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: ./.github/actions/setup-secret-scanner
      - name: Privately audit exact published GitHub surfaces
        env:
          FIRE_AI_GITHUB_AUDIT_TOKEN: ${{ github.token }}
          FIRE_AI_HISTORY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.historical || false }}
          FIRE_AI_HISTORY_AFTER_PULL_REQUEST: ${{ inputs.history_after_pull_request || '0' }}
          FIRE_AI_HISTORY_AFTER_WORKFLOW_RUN: ${{ inputs.history_after_workflow_run || '0' }}
          FIRE_AI_HISTORY_PULL_REQUEST_LIMIT: ${{ inputs.history_pull_request_limit || '10' }}
          FIRE_AI_HISTORY_WORKFLOW_RUN_LIMIT: ${{ inputs.history_workflow_run_limit || '1' }}
          FIRE_AI_HISTORY_CURSOR_SHA256: ${{ inputs.history_cursor_sha256 || '' }}
          FIRE_AI_HISTORY_THROUGH_PULL_REQUEST: ${{ inputs.history_through_pull_request || '0' }}
          FIRE_AI_HISTORY_THROUGH_WORKFLOW_RUN: ${{ inputs.history_through_workflow_run || '0' }}
          FIRE_AI_HISTORY_SNAPSHOT_INITIALIZED: ${{ inputs.history_snapshot_initialized || false }}
          FIRE_AI_HISTORY_SNAPSHOT_SHA256: ${{ inputs.history_snapshot_sha256 || '' }}
          FIRE_AI_PULL_REQUEST_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_requests || github.event.workflow_run.pull_requests[0].number || '' }}
          FIRE_AI_WORKFLOW_RUN_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.workflow_runs || github.event.workflow_run.id }}
        shell: bash
        run: |
          args=(
            --repository "${{ github.repository }}"
            --gitleaks "$FIRE_AI_GITLEAKS_BIN"
            --pull-requests "$FIRE_AI_PULL_REQUEST_IDS"
            --workflow-runs "$FIRE_AI_WORKFLOW_RUN_IDS"
          )
          if [[ "$FIRE_AI_HISTORY_MODE" == "true" ]]; then
            args+=(
              --historical
              --history-after-pull-request "$FIRE_AI_HISTORY_AFTER_PULL_REQUEST"
              --history-after-workflow-run "$FIRE_AI_HISTORY_AFTER_WORKFLOW_RUN"
              --history-pull-request-limit "$FIRE_AI_HISTORY_PULL_REQUEST_LIMIT"
              --history-workflow-run-limit "$FIRE_AI_HISTORY_WORKFLOW_RUN_LIMIT"
              --history-cursor-sha256 "$FIRE_AI_HISTORY_CURSOR_SHA256"
              --history-through-pull-request "$FIRE_AI_HISTORY_THROUGH_PULL_REQUEST"
              --history-through-workflow-run "$FIRE_AI_HISTORY_THROUGH_WORKFLOW_RUN"
              --history-snapshot-sha256 "$FIRE_AI_HISTORY_SNAPSHOT_SHA256"
            )
            if [[ "$FIRE_AI_HISTORY_SNAPSHOT_INITIALIZED" == "true" ]]; then
              args+=(--history-snapshot-initialized)
            fi
          fi
          python scripts/audit_github_published_surfaces.py "${args[@]}"
