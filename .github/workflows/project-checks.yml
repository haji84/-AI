name: project-checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fire_ai_test
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: fire_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fire_ai_test -d fire_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FIRE_AI_TEST_POSTGRES_URL: postgresql+psycopg://fire_ai_test:ci-only-disposable@localhost:5432/fire_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e "backend[test]"
      - name: Test
        run: python -m pytest backend/tests -q
      - name: Migration parser smoke
        run: |
          PYTHONPATH=backend python - <<'PY'
          from pathlib import Path
          from app.migrations import split_sql
          files = sorted(Path("db/migrations").glob("*.sql"))
          assert files
          for path in files:
              parts = split_sql(path.read_text(encoding="utf-8"))
              assert parts, path
              print(path.name, len(parts))
          PY
      - name: Frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("frontend/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          assert scripts
          Path("/tmp/fire-ai-frontend.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/fire-ai-frontend.js
          for file in frontend/*.js; do [ ! -f "$file" ] || node --check "$file"; done


  administration-browser:
    runs-on: ubuntu-latest
    env:
      FIRE_AI_TEST_BROWSER: '1'
      FIRE_AI_BROWSER_ARTIFACTS: /tmp/fire-ai-browser-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -e 'backend[test]' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Human administration browser test
        run: python -m pytest backend/tests/test_admin_browser.py backend/tests/test_assets_browser.py backend/tests/test_learning_browser.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-administration-browser-evidence
          path: /tmp/fire-ai-browser-evidence
          if-no-files-found: warn
