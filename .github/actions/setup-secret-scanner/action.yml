name: Install pinned secret scanner
description: Verify the official Linux x64 archive before installing Gitleaks.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        scanner_dir=$(mktemp -d "${RUNNER_TEMP}/fire-ai-gitleaks.XXXXXX")
        archive="${scanner_dir}/gitleaks.tar.gz"
        curl --fail --silent --show-error --location --max-time 60 \
          'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
          --output "$archive"
        printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status
        tar -xzf "$archive" -C "$scanner_dir" gitleaks
        printf '%s  %s\n' '88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509' "${scanner_dir}/gitleaks" | sha256sum --check --status
        test "$("${scanner_dir}/gitleaks" version)" = '8.30.1'
        printf 'FIRE_AI_GITLEAKS_BIN=%s\n' "${scanner_dir}/gitleaks" >> "$GITHUB_ENV"
