[project]
name = "fire-ai-local-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25,<26",
  "cryptography>=50,<51",
  "pydantic-settings>=2.14,<3",
  "tzdata>=2025.2,<2027",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "PyMuPDF>=1.26,<2",
  "Pillow>=12,<13",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4"
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
