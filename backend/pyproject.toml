[project]
name = "fire-ai-local-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.48,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25,<26",
  "pydantic-settings>=2.14,<3",
  "python-multipart>=0.0.20,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
